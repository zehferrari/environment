        entity_id: binary_sensor.corridor
        state: 'on'
        enabled: true
      - condition: state
        entity_id: light.lamps_mb
        state:
        - 'off'
      sequence:
      - choose:
        - conditions:
          - condition: time
            after: '22:00:00'
            before: 07:00:00
          sequence:
          - action: light.turn_on
            metadata: {}
            data:
              rgb_color:
              - 99
              - 69
              - 44
              brightness_pct: '{{ 30 if now().hour >= 22 else 1 }}'
            target:
              device_id: ce5f983ccf0d7648fd090b7784b5e8e7
          - wait_for_trigger:
            - trigger: state
              entity_id:
              - binary_sensor.underbed
              for:
                hours: 0
                minutes: 0
                seconds: 5
              from:
              - 'on'
              to:
              - 'off'
            timeout:
              hours: 0
              minutes: 0
              seconds: 10
              milliseconds: 0
            enabled: true
          - parallel:
            - target:
                entity_id:
                - switch.light_toilet
                - switch.lights_bathroom_light
              action: switch.turn_off
              data: {}
            - target:
                entity_id: light.light_corridor
              action: light.turn_off
              data: {}
          - action: light.turn_off
            metadata: {}
            data: {}
            target:
              entity_id:
              - light.light_bathroom_lamp
              - light.light_mb_wall
        - conditions:
          - condition: state
            entity_id: binary_sensor.presence_sensor_fp2_f6f1_presence_sensor_3
            state:
            - 'off'
            enabled: true
          sequence:
          - target:
              entity_id: light.lamps_mb
            action: light.turn_on
            data: {}
          - if:
            - condition: time
              before: '21:00:00'
              after: 09:00:00
            then:
            - target:
                device_id: f08847fbe9cbe95dd8da19d54be352b7
              action: light.turn_on
              data: {}
    - conditions:
      - condition: trigger
        id:
        - Out
      sequence:
      - target:
          entity_id:
          - light.lamps_mb
          - light.fan_light_master_bedroom
          - light.light_mb_wall
        data: {}
        action: light.turn_off
