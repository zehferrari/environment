alias: OnOff-CommonArea
description: ""
trigger:
  - platform: state
    entity_id:
      - light.lamps_ca
    from: "off"
    to: "on"
condition: []
action:
  - service: automation.turn_off
    target:
      entity_id:
        - automation.fp2_dinning
        - automation.fp2_sinkin
        - automation.sofa
        - automation.fp2_vitrola
    data:
      stop_actions: true
  - service: python_script.adjust_light_temp
    data:
      entity_id:
        - light.lamps_sink
      luminosity: >-
        {{ states('sensor.presence_sensor_fp2_a584_light_sensor_light_level') |
        int }}
  - service: automation.turn_on
    target:
      entity_id:
        - automation.fp2_dinning
        - automation.fp2_sinkin
        - automation.sofa
        - automation.fp2_vitrola
    data: {}
mode: single
