fan_auto_speed:
  alias: Fan Auto Speed
  sequence:
  - delay:
      seconds: 1
  - target:
      entity_id: '{{ fan_entity_id }}'
    data:
      percentage: "{% set temp = state_attr('climate.floor_fan', 'current_temperature')
        | default(0) | float %} {% set humid = state_attr('climate.floor_fan', 'current_humidity')
        | default(0) | float %} {% set hour = now().hour %} {% set current_speed =
        state_attr(fan_entity_id, 'percentage') | default(0) | float %}\n{# Define
        configuration parameters #} {% set hysteresis = 5 %}\n{# Handle sensor failure
        #} {% if temp == 0 or humid == 0 %}\n  33  {# Default to low speed if sensors
        fail #}\n{% else %}\n  {# Calculate target speed based on tropical climate
        conditions #}\n  {% set target_speed = namespace(value=0) %}\n  \n  {# Adjusted
        thresholds for tropical climate #}\n  {% if temp >= 29 or humid >= 80 or (temp
        >= 27 and humid >= 75) %}\n    {% set target_speed.value = 100 %}  {# High
        speed - very hot or very humid #}\n  {% elif temp >= 25 or humid >= 70 or
        (temp >= 23 and humid >= 65) %}\n    {% set target_speed.value = 66 %}   {#
        Medium speed - warm and humid #}\n  {% else %}\n    {% set target_speed.value
        = 33 %}   {# Low speed - relatively comfortable #}\n  {% endif %}\n  \n  {#
        Apply hysteresis to prevent oscillation #}\n  {% if (target_speed.value -
        current_speed) | abs <= hysteresis %}\n    {{ current_speed }}\n  {% else
        %}\n    {{ target_speed.value }}\n  {% endif %}\n{% endif %}\n"
    action: fan.set_percentage
  fields:
    fan_entity_id:
      name: Fan Entity ID
      description: The entity ID of the fan to control
      example: fan.living_room
      selector:
        entity:
          domain: fan
  mode: parallel
laundry:
  alias: Laundry
  sequence:
  - service: dreame_vacuum.vacuum_clean_segment
    target:
      entity_id: vacuum.l10s_ultra
    data:
      segments: 9
      repeats: 1
      suction_level: 1
      water_volume: 1
  mode: single
restart_motion_sensor_automations:
  alias: Restart Motion Sensor Automations
  sequence:
