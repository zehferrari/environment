timeout = 1200
max = 100
width = 340
height = 36
border_offset = 6
border_size = 2
bar_padding = 6
anchor = bottom center
margin = 0 0 60 0

# Colors are RRGGBB[AA]
background_color = 1e1e2ecc
bar_color = ffb300ff
border_color = 45475acc

# Indicate >100% volume (since we allow up to 150% in wpctl binds)
overflow_mode = nowrap
overflow_bar_color = fab387ff
overflow_background_color = 1e1e2ecc
overflow_border_color = fab387cc

# Show only on a specific output
output_mode = whitelist
orientation = horizontal

[output.hdmi_a_2]
name = HDMI-A-2
