

# Hyprland Configuration

# Autostart
exec-once = /home/zeh/.config/waybar/launch-waybar.sh
exec-once = sh -c 'pgrep -x mako >/dev/null || exec mako'
exec-once = sh -c 'pgrep -f polkit-gnome-authentication-agent-1 >/dev/null || exec /usr/libexec/polkit-gnome-authentication-agent-1'
exec-once = /usr/libexec/gsd-rfkill
exec-once = /home/zeh/.config/hypr/hyprpaper-solid-workspaces.sh

# Wayland environment variables
env = XDG_SESSION_TYPE,wayland
env = CLUTTER_BACKEND,wayland
env = SDL_VIDEODRIVER,wayland
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1
env = _JAVA_AWT_WM_NONREPARENTING,1

# Environment variables
env = XCURSOR_SIZE,32
env = QT_QPA_PLATFORMTHEME,qt5ct

# Input configuration
input {
    kb_layout = us
    follow_mouse = 1

    touchpad {
        natural_scroll = false
    }

    sensitivity = 0
}

# General settings
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

# Decoration
decoration {
    rounding = 12
    
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = false
        ignore_opacity = false
    }

    shadow {
        enabled = true
        range = 20
        render_power = 4
        offset = 0 2
        color = rgba(00000099)
        color_inactive = rgba(00000066)
    }
    
    dim_inactive = true
    dim_strength = 0.1
}

# Animations - Enhanced for high refresh rate
animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1

    animation = windows, 1, 5, myBezier, slide
    animation = windowsOut, 1, 7, smoothOut, slide
    animation = windowsMove, 1, 6, overshot, slide
    animation = border, 1, 10, default
    animation = borderangle, 1, 20, default, loop
    animation = fade, 1, 8, default
    animation = workspaces, 1, 6, overshot, slide
    animation = specialWorkspace, 1, 6, overshot, slidevert
}

# Layouts
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

# Touchpad gestures
gesture = 3, horizontal, workspace

# Misc - Performance optimizations
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    vrr = 0
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    enable_swallow = true
    swallow_regex = ^(kitty|alacritty|com\.mitchellh\.ghostty)$
}

# ==============================================================================
# KEY BINDINGS - Default Hyprland
# ==============================================================================
$mainMod = SUPER

# Example binds
bind = $mainMod, Q, exec, kitty
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, bash -lc '/home/zeh/Scripts/closeWindows.sh; hyprctl dispatch exit'
bind = $mainMod, E, exec, nautilus
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, fuzzel
bind = $mainMod, O, exec, kitty --title opencode /home/zeh/.opencode/bin/opencode
bind = $mainMod, B, exec, XDG_CURRENT_DESKTOP=GNOME gnome-control-center bluetooth
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, L, exec, /home/zeh/.local/bin/hyprlock-dpms

# Audio (PipeWire)
# Drive volume via PipeWire.
bind = , XF86AudioRaiseVolume, exec, /home/zeh/.local/bin/volume-osd up
bind = , XF86AudioLowerVolume, exec, /home/zeh/.local/bin/volume-osd down
bind = , XF86AudioMute, exec, playerctl play-pause
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Screenshots (Wayland) — Using grimblast with --freeze support
# Print: select region with FREEZE (screen freezes, then you select)
bind = , Print, exec, /home/zeh/.local/bin/grimblast --notify --freeze copysave area $HOME/Pictures/Screenshots/region-$(date +%Y%m%d-%H%M%S).png
# Shift+Print: full screen, save + copy
bind = SHIFT, Print, exec, /home/zeh/.local/bin/grimblast --notify copysave screen $HOME/Pictures/Screenshots/full-$(date +%Y%m%d-%H%M%S).png
# Alt+Print: active window, save + copy
bind = ALT, Print, exec, /home/zeh/.local/bin/grimblast --notify copysave active $HOME/Pictures/Screenshots/window-$(date +%Y%m%d-%H%M%S).png
# Super+Print: select region with freeze and open editor (swappy)
bind = $mainMod, Print, exec, /home/zeh/.local/bin/grimblast --freeze --filetype png edit area
# Ctrl+Print: legacy script mode (no freeze) if needed
bind = CTRL, Print, exec, /home/zeh/Scripts/screenshot.sh region

# Calculator
bind = CTRL SHIFT ALT, C, exec, gnome-calculator

# Shutdown
bind = CTRL SHIFT ALT, Page_Down, exec, /home/zeh/Scripts/shutDown.sh

# Session loader
bind = $mainMod, Z, exec, /home/zeh/Scripts/loadSession.sh --hard

# Close windows
bind = $mainMod SHIFT, C, exec, /home/zeh/Scripts/closeWindows.sh

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Show keyboard shortcuts
bind = $mainMod, slash, exec, /home/zeh/.config/hypr/show-keybindings.sh
bind = $mainMod, F1, exec, /home/zeh/.config/hypr/show-keybindings.sh

# Workspace persistence
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, default:true, persistent:true
workspace = 6, persistent:true
workspace = 7, persistent:true
workspace = 8, persistent:true
workspace = 9, persistent:true
workspace = 10, persistent:true

# ==============================================================================
# WINDOW RULES
# ==============================================================================

# JetBrains (PhpStorm, Toolbox, etc.)
# Fixes focus issues caused by JetBrains popup/tooltip windows (common under focus-follows-mouse WMs)
windowrule = tag +jb class:^(jetbrains-.*|jetbrains-toolbox)$ floating:1
windowrule = stay_focused tag:jb
windowrule = no_initial_focus tag:jb

# Float specific windows
windowrule = float class:^(pavucontrol)$
windowrule = float class:^(nm-connection-editor)$
windowrule = float title:^(Picture-in-Picture)$
windowrule = float title:^(Open File|Save File)$

# Development apps on ultrawide (workspace 6)
windowrule = workspace 6 class:^(Code|code-url-handler)$
windowrule = workspace 1 class:^(jetbrains-phpstorm)$
windowrule = workspace 6 title:^(.*Visual Studio Code.*)$

# Browsers (align with your session script)
# Firefox -> ws5, Brave -> ws7, Chromium -> ws8, Chrome -> ws9
windowrule = workspace 5 class:^(org\.mozilla\.firefox|firefox|Firefox)$
windowrule = workspace 7 class:^(brave-browser|Brave-browser|Brave)$
windowrule = workspace 8 class:^(chromium|chromium-browser|Chromium)$
windowrule = workspace 9 class:^(google-chrome|google-chrome-stable|chrome)$

# Communication apps on portrait monitor (workspace 4)
windowrule = workspace 4 class:^(discord|slack|teams|org.telegram.desktop)$

# Media on left monitor (workspace 2)
windowrule = workspace 2 class:^(Spotify|spotify|vlc)$

# GIMP on workspace 2 (left monitor now has only workspaces 1-2)
windowrule = workspace 2 class:^(Gimp|gimp-.*|org.gimp.GIMP)$
# Float all GIMP windows (RE2 in Hyprland does not support negative lookahead such as (?!...))
windowrule = float class:^(Gimp)$

# Size and position for dialogs
windowrule = size 800 600 title:^(Open File|Save File)$
windowrule = center title:^(Open File|Save File)$

# Pin floating windows
windowrule = pin title:^(Picture-in-Picture)$

# Opacity for terminals and editors
windowrule = opacity 0.95 0.85 class:^(kitty|alacritty|com\.mitchellh\.ghostty)$
windowrule = opacity 0.92 0.88 class:^(Code|code-url-handler)$

# Disable blur for games (performance)
windowrule = no_blur class:^(steam_app_.*)$
windowrule = no_blur fullscreen:1

# Immediate rendering for games
windowrule = immediate class:^(steam_app_.*)$

# Floating system monitor
windowrule = float class:^(floating_kitty)$
windowrule = size 1200 800 class:^(floating_kitty)$
windowrule = center class:^(floating_kitty)$

# Workspace persistence and special workspaces
workspace = special:scratchpad,gapsout:30,gapsin:15
workspace = special:music,gapsout:30,gapsin:15
