

# Hyprland Configuration for Fedora 43
# AMD Ryzen 9 9950X3D + NVIDIA RTX 5080

# Apply the monitor layout script at the very start
exec-once = /home/zeh/.config/hypr/apply-displays.sh

# Monitor configuration
# Detected via `hyprctl monitors -j` (connector names can change across boots/docks).
# Current EDID descriptions:
# - KOGAN AUSTRALIA PTY LTD KAMN34FXQULA   (3440x1440 ultrawide)
# - KOGAN AUSTRALIA PTY LTD KAMN27Q18CSA   (2560x1440)
# - Dell Inc. DELL U2421E                 (1920x1200, portrait)
# - ZUS ZEUSLAP-HDMI                      (2560x1600, scale 1.60)
# - ZUS ZEUSLAP-HDMI                      (2560x1600, scale 1.60)

# Layout (matches your current positions):
# Top row:    KOGAN 27" -> Dell Portrait -> KOGAN 34" Ultrawide PRIMARY
# Bottom row: ZEUSLAP left-ish -> ZEUSLAP right

# NOTE: connector names (DP-*) can change across boots/cables.
# The stable display layout (including rotations) is enforced by:
#   /home/zeh/.config/hypr/apply-displays.sh
# Keep Hyprland's built-in config generic so it doesn't accidentally rotate the wrong panel.

# Autostart
exec-once = /home/zeh/.config/waybar/launch-waybar.sh
exec-once = dunst
exec-once = lxpolkit
exec-once = /usr/libexec/gsd-rfkill
exec-once = /home/zeh/.config/hypr/hyprpaper-solid-workspaces.sh
exec-once = /home/zeh/.local/bin/disable-hdmi-audio

# If your display layout sometimes resets right after login, re-apply it once outputs are up.

# Volume OSD (wob)
# Use exec (not exec-once) so it comes up after `hyprctl reload` too.
exec = /home/zeh/.local/bin/start-wob

# Environment variables for NVIDIA
# NOTE: LIBVA_DRIVER_NAME is intentionally NOT forced. It was set to "nvidia", but
# nvidia-vaapi-driver isn't installed, so VA-API silently failed and apps fell back
# to CPU video decode. Left unset, libva auto-picks the right driver per GPU — e.g.
# Brave on the AMD-driven monitor (HDMI-A-2) uses radeonsi for HW VP9/AV1 decode.
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# NOTE: WLR_NO_HARDWARE_CURSORS is a wlroots variable; Hyprland (Aquamarine
# backend) ignores it. The real setting is the cursor{} section below.

# Additional NVIDIA Wayland optimizations
env = CLUTTER_BACKEND,wayland
env = SDL_VIDEODRIVER,wayland
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1
env = _JAVA_AWT_WM_NONREPARENTING,1

# NVIDIA hardware acceleration
env = NVD_BACKEND,direct
env = __GL_GSYNC_ALLOWED,1
env = __GL_VRR_ALLOWED,1

# Environment variables
env = XCURSOR_SIZE,32
env = QT_QPA_PLATFORMTHEME,qt5ct

# Cursor: force software cursors. This host drives monitors across two GPUs
# (NVIDIA RTX 5080 + AMD Radeon) at mixed scales (1.0 and 1.60). Hardware cursor
# planes fail across those GPU/scale boundaries, making the pointer disappear on
# some monitors and stutter when crossing between them.
cursor {
    no_hardware_cursors = true
    # 4 monitors are on the NVIDIA GPU and HDMI-A-2 is on the AMD GPU. Crossing
    # onto the AMD output is a cross-GPU cursor handoff; drawing the cursor into a
    # CPU-shareable buffer makes it render correctly on both GPUs (stops the
    # pointer vanishing / stuttering when it moves onto HDMI-A-2).
    use_cpu_buffer = true
}

# Input configuration
input {
    kb_layout = us
    follow_mouse = 1

    touchpad {
        natural_scroll = false
    }

    sensitivity = 0
}

# General settings
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

# Decoration - Enhanced for RTX 5080
decoration {
    rounding = 12
    
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = false
        ignore_opacity = false
    }

    shadow {
        enabled = true
        range = 20
        render_power = 4
        offset = 0 2
        color = rgba(00000099)
        color_inactive = rgba(00000066)
    }
    
    dim_inactive = true
    dim_strength = 0.1
}

# Animations - Enhanced for high refresh rate
animations {
    enabled = true

    # Subtle easing curve, used only by the workspace-switch animation below.
    bezier = smooth, 0.16, 1, 0.3, 1

    # Window open/close/move: OFF. Windows appear and resize instantly — no motion
    # on the new window AND none on the existing window that reflows to make room
    # (a tiling reflow must resize neighbors; the only way to avoid the movement is
    # to not animate it).
    animation = windows, 0
    animation = windowsOut, 0
    animation = windowsMove, 0
    animation = fade, 0
    animation = border, 1, 10, default
    # NOTE: a looping borderangle animation renders every frame forever, which
    # (with vfr=false) pins the compositor's render thread near 100% CPU and makes
    # the cursor stutter/vanish on all monitors. Keep it one-shot (no `loop`).
    animation = borderangle, 1, 20, default
    # Keep a subtle workspace-switch animation (this isn't the window reflow).
    animation = workspaces, 1, 5, smooth, slide
    animation = specialWorkspace, 1, 5, smooth, slidevert
}

# Layouts
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

# Gestures - using defaults (workspace_swipe option removed in newer versions)

# Misc - Performance optimizations
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    # vfr=false renders every monitor at full refresh nonstop (~100% CPU on this
    # 5-monitor / high-refresh setup -> cursor stutter/vanish). vfr=true lets idle
    # monitors stop rendering. If HDMI panels flicker again, revisit per-monitor.
    vfr = true
    vrr = 0
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    enable_swallow = true
    swallow_regex = ^(kitty|alacritty|com\.mitchellh\.ghostty)$
}

# ==============================================================================
# KEY BINDINGS - Default Hyprland
# ==============================================================================
$mainMod = SUPER

# Example binds
bind = $mainMod, Q, exec, ghostty
bind = $mainMod, C, killactive,
# SUPER+M: gracefully close all windows (saving sessions), then exit Hyprland.
bind = $mainMod, M, exec, /home/zeh/Scripts/logout.sh
bind = $mainMod, E, exec, nautilus
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, fuzzel
bind = $mainMod, B, exec, XDG_CURRENT_DESKTOP=GNOME gnome-control-center bluetooth
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, L, exec, /home/zeh/.local/bin/hyprlock-dpms
bind = $mainMod, A, exec, /home/zeh/.config/hypr/apply-displays.sh

# Audio (PipeWire)
# Drive volume via PipeWire and show an OSD via wob.
bind = , XF86AudioRaiseVolume, exec, /home/zeh/.local/bin/volume-osd up
bind = , XF86AudioLowerVolume, exec, /home/zeh/.local/bin/volume-osd down
bind = , XF86AudioMute, exec, playerctl play-pause
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Screenshots (Wayland) — Using grimblast with --freeze support
# Print: select region with FREEZE (screen freezes, then you select)
bind = , Print, exec, /home/zeh/.local/bin/grimblast --notify --freeze copysave area $HOME/Pictures/Screenshots/region-$(date +%Y%m%d-%H%M%S).png
# Shift+Print: full screen, save + copy
bind = SHIFT, Print, exec, /home/zeh/.local/bin/grimblast --notify copysave screen $HOME/Pictures/Screenshots/full-$(date +%Y%m%d-%H%M%S).png
# Alt+Print: active window, save + copy
bind = ALT, Print, exec, /home/zeh/.local/bin/grimblast --notify copysave active $HOME/Pictures/Screenshots/window-$(date +%Y%m%d-%H%M%S).png
# Super+Print: select region with freeze and open editor (swappy)
bind = $mainMod, Print, exec, /home/zeh/.local/bin/grimblast --freeze --filetype png edit area
# Ctrl+Print: legacy script mode (no freeze) if needed
bind = CTRL, Print, exec, /home/zeh/Scripts/screenshot.sh region

# Calculator
bind = CTRL SHIFT ALT, C, exec, gnome-calculator

# Shutdown
bind = CTRL SHIFT ALT, Page_Down, exec, /home/zeh/Scripts/shutDown.sh

# Session loader
bind = $mainMod, Z, exec, /home/zeh/Scripts/loadSession.sh --hard

# Close windows
bind = $mainMod SHIFT, C, exec, /home/zeh/Scripts/closeWindows.sh

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Show keyboard shortcuts
bind = $mainMod, slash, exec, /home/zeh/.config/hypr/show-keybindings.sh
bind = $mainMod, F1, exec, /home/zeh/.config/hypr/show-keybindings.sh

# Workspace assignments per monitor (2 per display)
# Requested mapping:
#   DP-5      -> 1,2
#   DP-6      -> 3,4
#   DP-4      -> 5,6
#   DP-1      -> 7,8
#   HDMI-A-3  -> 9,10

# Workspace assignments - managed dynamically by apply-displays.sh
# (Monitor constraints removed to allow script to handle connector changes)
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, default:true, persistent:true
workspace = 6, persistent:true
workspace = 7, persistent:true
workspace = 8, persistent:true
workspace = 9, persistent:true
workspace = 10, persistent:true

# ==============================================================================
# WINDOW RULES
# ==============================================================================

# JetBrains (PhpStorm, etc.) — Java/AWT on XWayland.
# The autocomplete/tooltip/menu popups come up as floating windows titled "win0",
# "win1", etc. Under follow_mouse they steal/lose focus and flicker, so we pin focus
# to THEM. Scope strictly by title:^(win.*)$ — NOT by floating:1 — otherwise real
# dialogs (Tip of the Day, Settings) and the main IDE window get focus-trapped by
# stayfocused, which makes the top bar/menus unclickable.
windowrulev2 = stayfocused,    class:^(jetbrains-.*)$, title:^(win.*)$
windowrulev2 = noinitialfocus, class:^(jetbrains-.*)$, title:^(win.*)$

# Float specific windows
windowrulev2 = float,class:^(pavucontrol)$
windowrulev2 = float,class:^(nm-connection-editor)$
windowrulev2 = float,title:^(Picture-in-Picture)$
windowrulev2 = float,title:^(Open File|Save File)$

# Development apps on ultrawide (workspace 6)
windowrulev2 = workspace 6,class:^(Code|code-url-handler)$
windowrulev2 = workspace 1,class:^(jetbrains-phpstorm)$
windowrulev2 = workspace 6,title:^(.*Visual Studio Code.*)$

# Browsers: NOT pinned to workspaces — they open on the focused workspace.
# Per-workspace placement happens only via Scripts/loadSession.sh (SUPER+Z).

# Communication apps on portrait monitor (workspace 4)
windowrulev2 = workspace 4,class:^(discord|slack|teams|org.telegram.desktop)$

# Media on left monitor (workspace 2)
windowrulev2 = workspace 2,class:^(Spotify|spotify|vlc)$

# GIMP on workspace 2 (left monitor now has only workspaces 1-2)
windowrulev2 = workspace 2,class:^(Gimp|gimp-.*|org.gimp.GIMP)$
# Float all GIMP windows (RE2 in Hyprland does not support negative lookahead such as (?!...))
windowrulev2 = float,class:^(Gimp)$

# Size and position for dialogs
windowrulev2 = size 800 600,title:^(Open File|Save File)$
windowrulev2 = center,title:^(Open File|Save File)$

# Pin floating windows
windowrulev2 = pin,title:^(Picture-in-Picture)$

# Opacity for terminals and editors
windowrulev2 = opacity 0.95 0.85,class:^(kitty|alacritty|com\.mitchellh\.ghostty)$
windowrulev2 = opacity 0.92 0.88,class:^(Code|code-url-handler)$

# Disable blur for games (performance)
windowrulev2 = noblur,class:^(steam_app_.*)$
windowrulev2 = noblur,fullscreen:1

# Immediate rendering for games
windowrulev2 = immediate,class:^(steam_app_.*)$

# Floating system monitor
windowrulev2 = float,class:^(floating_kitty)$
windowrulev2 = size 1200 800,class:^(floating_kitty)$
windowrulev2 = center,class:^(floating_kitty)$

# Workspace persistence and special workspaces
workspace = special:scratchpad,gapsout:30,gapsin:15
workspace = special:music,gapsout:30,gapsin:15
