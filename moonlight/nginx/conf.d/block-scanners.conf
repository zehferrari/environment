# Block aggressive scanners, crawlers, and automated tools

geo $local_network_client {
    default 0;
    127.0.0.1/32 1;
    ::1/128 1;
    10.0.0.0/24 1;
    161.8.1.4/32 1;
}

map $http_user_agent $block_scanner {
    default 0;
    
    # Block common scanner tools
    ~*^curl 1;
    ~*^python 1;
    ~*python-requests 1;
    ~*Python-urllib 1;
    ~*^Wget 1;
    ~*^Java/ 1;
    ~*^Go-http-client 1;
    
    # Block security scanners
    ~*nikto 1;
    ~*nmap 1;
    ~*masscan 1;
    ~*sqlmap 1;
    ~*acunetix 1;
    ~*nessus 1;
    ~*burp 1;
    ~*zap 1;
    
    # Block aggressive crawlers
    ~*InternetMeasurement 1;
    ~*SemrushBot 1;
    ~*MJ12bot 1;
    ~*AhrefsBot 1;
    ~*DotBot 1;
    ~*PetalBot 1;
    ~*BLEXBot 1;
}

map "$local_network_client:$bad_bot" $external_bad_bot {
    default 0;
    "0:1" 1;
}

map "$local_network_client:$block_scanner" $external_block_scanner {
    default 0;
    "0:1" 1;
}

# Block requests to sensitive files
map $request_uri $block_sensitive {
    default 0;
    
    # Environment and config files
    ~*\.env 1;
    ~*\.env\. 1;
    ~*\.git 1;
    ~*\.svn 1;
    ~*\.htaccess 1;
    ~*wp-config\.php 1;
    
    # Debug and info files
    ~*phpinfo 1;
    ~*\.sql 1;
    ~*\.log([?/]|$) 1;
    ~*\.bak 1;
    ~*\.backup 1;
    ~*\.old 1;
}


# WebSocket connection header helper. Used by proxied apps such as Home Assistant.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
