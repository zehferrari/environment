# /etc/nginx/sites-available/mission-control.example.com (or distro equivalent)
# Replace mission-control.example.com below with the deployment hostname.
#
# Assumes existing Let's Encrypt setup on this host. If certbot needs to
# issue a new certificate, comment out the SSL block and run:
#   certbot --nginx -d <mission-control-hostname>
# then uncomment.

# 80 → 443 redirect (also lets certbot complete HTTP-01 challenges).
server {
    listen 80;
    listen [::]:80;
    server_name mission-control.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mission-control.example.com;

    ssl_certificate     /etc/letsencrypt/live/mission-control.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mission-control.example.com/privkey.pem;

    # Reuse your deployment's standard TLS options when available.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Keep this above the default 25 MiB per-file attachment cap and aligned
    # with the default 30 MiB Next.js Server Action request-body limit.
    client_max_body_size 30m;

    # During a worktree rebuild/switch (Settings → Worktree live preview, or
    # `pm-switch`) the upstream Next.js process (pm.service) is briefly down
    # (~2-5s) and nginx would otherwise return a raw 502. Serve a friendly,
    # self-reloading "rebuilding" page instead. This is keyed on upstream
    # availability — not on any branch — so it covers every worktree/branch
    # automatically, and also softens genuine crashes (the page recovers on its
    # own when the app answers again).
    error_page 502 503 504 /rebuilding.html;
    location = /rebuilding.html {
        root /var/www/pm-maintenance;   # install via install-pm-switch.sh
        internal;                        # only reachable through error_page
        add_header Cache-Control "no-store" always;
        add_header Retry-After 5 always;
    }

    location /api/openclaw/pm-channel/events {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding off;
        gzip off;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # Connection-refused/timeout during a restart yields an nginx-generated
        # 502/504 that error_page handles; this also intercepts a 5xx the app
        # itself emits while booting.
        proxy_intercept_errors on;
    }
}
