# moonlight: /etc/nginx/sites-available/mission-control
# An exact hostname overrides the existing *.vixi.au proxy. Keep its TLS,
# request restrictions, and upstream; enable multiplexing for PM's SSE streams.
# nginx 1.22 requires the listen parameter ("http2 on" needs >=1.25.1).
server {
    listen [::]:443 ssl http2;
    listen 443 ssl http2;
    server_name agents.vixi.au;

    access_log /var/log/nginx/vixiAu.access zehlog;
    error_log /var/log/nginx/vixiAu.error;
    charset utf-8;
    autoindex off;
    log_not_found off;
    include /etc/nginx/sites-available/modules/restrictionsRules;

    ssl_certificate /etc/letsencrypt/live/vixi.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vixi.au/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 30m;

    location / {
        proxy_pass http://10.0.0.105;
        proxy_set_header Host $host;
        proxy_redirect http:// https://;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE and streamed page responses are ordinary HTTP, not WebSockets.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }
}
