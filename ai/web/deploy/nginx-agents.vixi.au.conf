# /etc/nginx/sites-available/agents.vixi.au (or distro equivalent)
# Reverse-proxy + HTTPS for PM walking skeleton (HOMELAB-43).
#
# Assumes existing Let's Encrypt setup on this host. If certbot needs to
# issue a new cert for agents.vixi.au, comment out the SSL block and run:
#   certbot --nginx -d agents.vixi.au
# then uncomment.

# 80 → 443 redirect (also lets certbot complete HTTP-01 challenges).
server {
    listen 80;
    listen [::]:80;
    server_name agents.vixi.au;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agents.vixi.au;

    ssl_certificate     /etc/letsencrypt/live/agents.vixi.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agents.vixi.au/privkey.pem;

    # Pulled from the existing vixi.au include if available.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 8m;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
