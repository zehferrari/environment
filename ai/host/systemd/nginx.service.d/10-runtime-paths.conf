[Service]
# nginx.conf runs workers as zeh:code-agents on thinkpad, but the openSUSE
# package can restore /var/lib/nginx as nginx:nginx mode 0750 during upgrades.
# Reconcile the spool directories before each start so buffered request bodies
# and proxy responses remain writable by the actual worker identity.
ExecStartPre=/usr/bin/install -d -o zeh -g code-agents -m 0750 /var/lib/nginx /var/lib/nginx/fastcgi /var/lib/nginx/proxy /var/lib/nginx/scgi /var/lib/nginx/tmp /var/lib/nginx/uwsgi
ExecStartPre=/usr/bin/install -d -o zeh -g zeh -m 0750 /var/log/nginx
