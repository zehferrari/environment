[Service]
# Normal gateways use well below 1 GiB, while one retained-state incident
# reached V8's default ~4 GiB heap ceiling. Begin reclaim before a runaway
# dominates the host and contain each of the four gateways to a fraction of
# the 64 GiB machine. Keep V8's default heap limit until the new redacted
# pressure snapshot identifies whether retained state or a leak caused growth.
MemoryAccounting=yes
MemoryHigh=6G
MemoryMax=8G
MemorySwapMax=2G
TasksMax=1024
