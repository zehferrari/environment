[Service]
# 2026-07-28: heavy claude-cli turns pushed one gateway's cgroup past the
# old 6G high-water mark with its 2G swap ceiling pegged; memory.high reclaim
# throttling then froze the event loop for minutes (226 s p99 delay at 3 %
# CPU), stalling turns until the watchdog/monitor killed them. Give heavy
# turns headroom (worst observed peak 6.4G on a 58 GiB host) and allow no
# swap so a genuine overrun fails fast: OOM-kill at MemoryMax plus
# Restart=always recovers in seconds instead of a minutes-long frozen
# event loop.
MemoryAccounting=yes
MemoryHigh=8G
MemoryMax=10G
MemorySwapMax=0
TasksMax=1024
# Cap the node gateway heap well below the cgroup budget so the remainder
# stays available to claude-cli child processes. The assignment repeats
# --dns-result-order=ipv4first because a drop-in NODE_OPTIONS value
# replaces the unit's own.
Environment="NODE_OPTIONS=--dns-result-order=ipv4first --max-old-space-size=2560"
